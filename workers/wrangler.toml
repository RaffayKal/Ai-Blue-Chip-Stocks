# Cloudflare deploy config for the read-only, notify-only viability checker.
#
# Two implementations of the same job live in this directory:
#   - scheduled_entrypoint.py   (Python Worker, cron-triggered function)
#   - src/viability_workflow.ts (TS Workflow, durable multi-step)
#
# Pick ONE as `main` below. Both are notify-only: they check an Alpaca
# BTC/USD quote and POST to a webhook if the spread looks tight. Neither
# places an order, and neither can reach Robinhood or this repo's local
# capital_engine gate (those only run on the operator's Mac).
#
# Nothing here is deployed yet -- this environment has no `wrangler` CLI and
# no Cloudflare account token configured. To actually deploy:
#   1. npm install -g wrangler   (or `npx wrangler`)
#   2. wrangler login
#   3. wrangler secret put ALPACA_API_KEY_ID
#      wrangler secret put ALPACA_API_SECRET_KEY
#      wrangler secret put NOTIFY_WEBHOOK_URL
#   4. wrangler deploy

name = "aibluechipstocks-viability-checker"
compatibility_date = "2026-09-01"
compatibility_flags = ["python_workers"]

main = "scheduled_entrypoint.py"

[triggers]
crons = ["*/15 * * * *"]

[vars]
SYMBOL = "BTC/USD"
SPREAD_BPS_THRESHOLD = "50"

# --- To use the TS Workflow instead ---
# Comment out `main`/`compatibility_flags` above and uncomment below.
# Workflows are triggered from a Worker (not directly by a cron trigger),
# so you'd also need a small entrypoint Worker that calls
# env.VIABILITY_WORKFLOW.create() on a scheduled() handler.
#
# main = "src/entry.ts"
# [[workflows]]
# name = "viability-workflow"
# binding = "VIABILITY_WORKFLOW"
# class_name = "ViabilityWorkflow"
