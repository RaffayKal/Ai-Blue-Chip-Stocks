<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stocktwits Cards Widget</title>
</head>
<body>
  <!-- Stocktwits Widget BEGIN -->
  <div class="stocktwits-widget">
    <script async src="https://widgets-api.stocktwits-cdn.com/loader.js">
{
  "assetClass": "all",
  "colorTheme": "light",
  "location": "US",
  "logos": true,
  "quantity": 10,
  "sparklines": true,
  "transparent": false,
  "widget": "cards"
}
    </script>
  </div>
  <!-- Stocktwits Widget END -->
</body>
</html>
